style_guide:
  body: |
    **Don't Give It Away Too Soon!**

    When reviewing the [Presentation](https://radiopaedia.org/articles/presentation-case) for a case, it is tempting to include more details rather than fewer; however, in [quiz mode](https://radiopaedia.org/articles/quiz-mode), the presentation is used to frame the case, so it should not give away too many details (such as the diagnosis!) too soon.

    This allows our readers to work through the scenario as they would in real life.
    It is a small detail, but one that is easy to overlook and makes a big difference in how the case is experienced.

    P.S. Don't forget that age and gender actually belong in the [Patient data](https://radiopaedia.org/articles/patient-data) section.

