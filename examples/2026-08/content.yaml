# Quantum Mottle - August 2026 (as sent; transcribed from the Postcards export)

editor_in_chief:
  body: |
    What a month it has been - R26 was a roaring success, and I enjoyed getting on the chat while listening to lectures and playing the various games in the downtime! A big congratulations to the co-conveners Sally Ayesa, Daniel Gewolb, and Vikas Shah, ably supported by Andrew Dixon, Andrew Murphy, Michael Nel, and Emily Chetwin.

    I also had the chance to catch up with Frank, as Bluey would say, "In real life," at the Tasmanian Branch ASM (Frank has gone from a conference of ~15,000 participants to maybe 40!), but it was a great reminder of what we've built as I listened to Frank's "History of Radiopaedia" talk for maybe the tenth time!

    In the background, I have started onboarding Karina as our brand-new Evidence-Based Content Manager and am working through various "back-of-house" projects that have been on the back burner, with a focus on contributor interactions and editorial board composition.

