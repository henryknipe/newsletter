# Quantum Mottle - April 2026 (as sent; transcribed from the Postcards export)

editor_in_chief:
  body: |
    Generative AI has been around for quite a while, and various tools have been in use for quite a while. However, this [2026 paper](https://pubs.rsna.org/doi/10.1148/radiol.252094) reinforced our concerns about deepfake medical images and the risk they pose to Radiopaedia's reputation. We have already had one user suspected of uploading AI-generated x-rays (which were identified before publication, thankfully!).

    As a result, we now have a formal [Generative AI policy](https://radiopaedia.org/generative-artificial-intelligence-policy), but the TLDR is that AI-created content should not be uploaded to Radiopaedia, whether in case discussions, articles, or images. However, AI tools are most certainly to be used appropriately. For example, Jeremy has created an awesome review tool for those involved in the CME review project.

    One major change is that Radiopaedia can no longer accept "single image cases" (regardless of whether they are in DICOM or jpg/png format) as this is currently the highest-risk category. The style guide has been updated in various locations to reflect this, and there is a new Editor Comment - "Single image cases not accepted" (id: 341) to assist you in the moderation process.

    Any questions, please hit up [Radiopaedia Chat](https://radiopaedia.org/chat/editorial-board/channels/town-square).

