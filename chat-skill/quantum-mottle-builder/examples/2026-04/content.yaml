updates:
  - title: April Fools
    icon: clown
    body: |
      Well done to the team for the reCAPTCHA prank and the usual Rick Roll!

      I get done pretty much every year, and even posted about how we were now training AI via reCAPTCHA!!
  - title: Special pages now in search
    icon: search
    body: |
      Special pages, such as Paediatric X-ray Atlas and Programmable CSF Shunt page, are now visible in the search results.
  - title: Community Team Project
    icon: muscle
    body: |
      As part of getting Radiopaedia as well-referenced as possible, we identified 140 Anatomy articles we no references.

      I asked a few recent contributors in the Anatomy section to participate (along with Craig Hacking) in adding references to the articles, and it was done very quickly!

      I'm quite excited to run a few more projects utilising the wider Radiopaedia communtiy.

