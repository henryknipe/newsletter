style_guide:
  body: |
    When reviewing cases that include clinical photographs of paediatric patients, editors should always check that proper consent has been documented. Clinical images of children require explicit permission, even when the images appear non-identifying.

    If consent is not clearly stated in the case, or if there is any uncertainty, please query the contributor or hold the case until confirmation is obtained. This helps maintain Radiopaedia's standards of privacy, safety, and ethical publishing.

    More info: [https://radiopaedia.org/articles/patient-confidentiality](https://radiopaedia.org/articles/patient-confidentiality)

