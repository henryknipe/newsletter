# Quantum Mottle - September 2026 (as sent; transcribed from the Postcards export)

editor_in_chief:
  body: |
    The topic of [Case discussion](https://radiopaedia.org/articles/case-discussion) has come up again, and I'm not surprised given how quickly generative AI is progressing. I don't think the question is "was this written by AI?" We have a Generative AI policy and some Editor Comments to help with the mechanics, but the test that matters is much simpler. Is the discussion about the patient?

    One of my registrars recently wrote a case discussion on this [Microcystic meningioma](https://radiopaedia.org/cases/microcystic-meningioma-4) case that was maybe six sentences long, and it was exactly what we are aiming for. It related the symptoms to the imaging findings, explained how the diagnosis was established and how the patient was managed, and left one or two learning points. Nothing about it duplicated the article... because that is what the article is for.

    It's the classic case report "lit review" style that's the problem, whoever or whatever wrote it. It creates "multiple sources of truth", where the case says one thing and our article says another.

    My rule of thumb is that if it reads like "AI-slop", push back to draft - I've been doing this with curiosity rather than accusing them of doing something wrong, so as always, keep the messaging kind and helpful. If you are unsure, please post in the Moderation channel or escalate to one of the managing/senior editors or to me.

