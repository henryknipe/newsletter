style_guide:
  body: |
    **Annotations in Action**

    **🧠 Did You Know?**
    [Annotations](https://radiopaedia.org/articles/annotations) make Radiopaedia cases awesome! They highlight key findings directly on images and link from the [findings](https://radiopaedia.org/articles/findings-cases) text. This makes it easier for readers to connect what's written in the imaging findings and what the images show.

    **✅ Why use them?**
    - annotations make cases clearer and more engaging
    - great for teaching and learning, since readers can click on labels in Findings and jump straight to the spot on the image

    **✍️ Tips for editors when reviewing annotations:**
    - match annotations precisely with what is described in the findings
    - keep the label short and standard
    - focus on the most important features since too many labels can clutter the image
    - always preview with and without annotations before publishing

    Look out for orange text in the findings section. That is your cue that annotations are active!

