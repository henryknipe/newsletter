# Shared settings. Put personal overrides in config.local.yaml (git-ignored).

newsletter:
  subject: "Quantum Mottle - {month} {year}"
  from: "Henry Knipe <henry.knipe@radiopaedia.org>"
  # The .eml draft is addressed to you; add the editorial board as BCC when you send.
  to: "henry.knipe@radiopaedia.org"
  contact_email: "henry.knipe@radiopaedia.org"
  contact_dm_url: "https://radiopaedia.org/chat/editorial-board/messages/@henryknipe"
  # File of editor addresses for `qm gmail` BCC (keep it out of git, e.g. in config.local.yaml).
  bcc_file: null
  nav:
    - {label: Home, url: "https://www.radiopaedia.org"}
    - {label: Projects, url: "https://www.radiopaedia.org/projects"}
    - {label: Chat, url: "https://www.radiopaedia.org/chat"}
  # The "Made with postcards" badge + tracking pixel from the Postcards export.
  postcards_footer: true

# Update icons by name (`icon: mri`). These are already hosted by Postcards from past issues.
# Add your own: upload a PNG to Postcards and copy its URL, or use a file in assets/icons/.
icons:
  default: https://cloudfilesdm.com/postcards/7f35aea5059ebba5c0d95dfc5fa417f9-3915c34e.png
  release: https://cloudfilesdm.com/postcards/image-1748146878957-67f60a02.png
  evidence: https://cloudfilesdm.com/postcards/evidence-661952ad.png
  mcq: https://cloudfilesdm.com/postcards/59b266c71c5cd44516c666df3f7dc816-6dfb004c.png
  mri: https://cloudfilesdm.com/postcards/mri-c43c004b.png
  add: https://cloudfilesdm.com/postcards/add_1242520-32c7638b.png
  clown: https://cloudfilesdm.com/postcards/clown_2271762-7f17ae69.png
  search: https://cloudfilesdm.com/postcards/search_1828048-f9df3c7b.png
  muscle: https://cloudfilesdm.com/postcards/muscle_7908631-22ff8de8.png

sources:
  dashboard:
    url: https://radiopaedia.org/admin/restricted_pages/3606
    # CSS selector for the part of the page to capture. null = full page.
    selector: null
    viewport_width: 1200
    # Extra wait (ms) after load so charts finish drawing.
    wait_ms: 3000
  release_notes:
    url: https://radiopaedia.org/release-notes
  next_meeting:
    url: https://radiopaedia.org/next-editor-meeting
  social_magic_moments:
    # Radiopaedia Chat (Mattermost) - read via its API using your browser login.
    chat_base: https://radiopaedia.org/chat
    team: editorial-board
    channel: social-magic-moments
  style_guide:
    # Arlene's Google Doc
    doc_id: 1UXBCNyfSWjalRA64DuDwOyJtwiHRqV2CUlJydv-q8p8
    tab: t.0

# Persistent browser profile used for logged-in scraping (`qm login` once).
browser_profile: ~/.quantum-mottle/browser-profile
